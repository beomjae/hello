<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구구단</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }
    .table {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .table h2 {
      text-align: center;
      color: #4CAF50;
      margin-top: 0;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 10px;
    }
    .row {
      padding: 8px;
      margin: 5px 0;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    .row:hover {
      background-color: #f0f0f0;
    }
    .equation {
      font-size: 16px;
      color: #555;
    }
    .result {
      font-weight: bold;
      color: #333;
    }
    @media (max-width: 768px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 480px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>구구단 (Multiplication Table)</h1>
  <div class="container" id="gugudan-container"></div>

  <script>
    function createGugudan() {
      const container = document.getElementById('gugudan-container');

      // 2단부터 9단까지
      for (let dan = 2; dan <= 9; dan++) {
        const tableDiv = document.createElement('div');
        tableDiv.className = 'table';

        const title = document.createElement('h2');
        title.textContent = `${dan}단`;
        tableDiv.appendChild(title);

        // 1부터 9까지 곱하기
        for (let i = 1; i <= 9; i++) {
          const row = document.createElement('div');
          row.className = 'row';

          const equation = document.createElement('span');
          equation.className = 'equation';
          equation.textContent = `${dan} × ${i} = `;

          const result = document.createElement('span');
          result.className = 'result';
          result.textContent = dan * i;

          row.appendChild(equation);
          row.appendChild(result);
          tableDiv.appendChild(row);
        }

        container.appendChild(tableDiv);
      }
    }

    // 페이지 로드 시 구구단 생성
    createGugudan();
  </script>
</body>
</html>
